---
- name: Provisionamento e Deploy Wepink App
  hosts: staging
  become: yes
  vars:
    project_root: "/opt/wepink"
    app_image: "maribma19/awakenrise_backend:latest"
    domain_name: "awakenrise.com.br"
    discord_webhook_url: "{{ discord_webhook_url | default('') }}"

  tasks:
    - name: Atualizar cache do apt
      apt:
        update_cache: yes

    - name: Instalar dependências básicas
      apt:
        name:
          - curl
          - git
          - ufw
          - apt-transport-https
          - ca-certificates
          - software-properties-common
          - python3-pip
          - certbot
          - python3-certbot-nginx
        state: present

    - name: Adicionar chave GPG do Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Adicionar repositório Docker
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present

    - name: Instalar Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - nginx
        state: present

    - name: Parar Apache (caso exista) para liberar porta 80
      service:
        name: apache2
        state: stopped
      ignore_errors: yes

    - name: Remover container do Frontend antigo para liberar porta 80
      docker_container:
        name: wepink-frontend
        state: absent
      ignore_errors: yes

    - name: Garantir que o Nginx está rodando
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Garantir que o Docker está rodando
      service:
        name: docker
        state: started
        enabled: yes

    - name: Permitir SSH no Firewall
      ufw:
        rule: allow
        name: OpenSSH

    - name: Permitir Portas de Aplicação e Monitoramento
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - '80'
        - '443'
        - '8080'  # Backend App
        - '3000'  # Grafana
        - '9090'  # Prometheus
        - '15672' # RabbitMQ Management

    - name: Desabilitar UFW (usar apenas Cloud Firewall da DO)
      ufw:
        state: disabled

    - name: Criar diretório do projeto
      file:
        path: "{{ project_root }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Criar rede customizada do Docker
      docker_network:
        name: awakenrise-network

    - name: Pull da imagem Docker mais recente
      docker_image:
        name: "{{ app_image }}"
        source: pull

    - name: Rodar container do RabbitMQ
      docker_container:
        name: rabbitmq
        image: "rabbitmq:3-management"
        state: started
        restart_policy: always
        published_ports:
          - "5672:5672"   # AMQP
          - "15672:15672" # Management UI
        env:
          RABBITMQ_DEFAULT_USER: "wepink_user"
          RABBITMQ_DEFAULT_PASS: "wepink_pass"
        networks:
          - name: awakenrise-network

    - name: Remover container antigo (se existir) para liberar porta
      docker_container:
        name: wepink-backend
        state: absent

    - name: Aguardar MySQL estar pronto
      wait_for:
        host: "{{ mysql_host }}"
        port: "{{ mysql_port }}"
        timeout: 60

    - name: Aguardar RabbitMQ estar pronto
      wait_for:
        host: 127.0.0.1
        port: 5672
        timeout: 60

    - name: Rodar container do Backend
      docker_container:
        name: awakenrise-backend
        image: "{{ app_image }}"
        state: started
        restart_policy: always
        pull: yes
        recreate: yes
        published_ports:
          - "8080:8080"
        env:
          APP_ENV: staging
          DB_URL: "{{ mysql_user }}:{{ mysql_password }}@tcp({{ mysql_host }}:{{ mysql_port }})/defaultdb?tls=skip-verify&parseTime=true"
          # Limpeza automática: remove prefixos como 'REDIS_URL=' ou 'export ' caso existam no segredo
          REDIS_URL: "{{ redis_url | regex_replace('^(REDIS_URL=|export REDIS_URL=)', '') }}"
          RABBITMQ_URL: "amqp://wepink_user:wepink_pass@rabbitmq:5672/"
          # Credenciais do Mercado Pago OAuth (injetadas via GitHub Secrets)
          MP_APP_ID: "{{ mp_app_id | default('') }}"
          MP_CLIENT_SECRET: "{{ mp_client_secret | default('') }}"
          MP_REDIRECT_URI: "{{ mp_redirect_uri | default('') }}"
          # Segredos de aplicação
          JWT_SECRET: "{{ jwt_secret | default('') }}"
          ENCRYPTION_KEY: "{{ encryption_key | default('') }}"
        networks:
          - name: awakenrise-network

    - name: Aguardar container estabilizar
      pause:
        seconds: 5

    - name: Verificar se o Backend está rodando
      command: docker inspect -f "{{ '{{' }} .State.Running {{ '}}' }}" awakenrise-backend
      register: backend_status
      ignore_errors: yes

    - name: LOGS DO BACKEND (Diagnóstico)
      command: docker logs awakenrise-backend
      register: backend_logs

    - name: Print Backend Logs
      debug:
        var: backend_logs.stdout_lines

    - name: Verificar portas abertas no servidor (Host)
      command: ss -tulpn
      register: host_ports

    - name: Print Host Ports
      debug:
        var: host_ports.stdout_lines

    - name: Criar config básica do Prometheus
      copy:
        dest: /tmp/prometheus.yml
        content: |
          global:
            scrape_interval: 5s
          scrape_configs:
            - job_name: 'wepink-backend'
              static_configs:
                - targets: ['awakenrise-backend:8080']

    - name: Rodar container do Prometheus
      docker_container:
        name: prometheus
        image: prom/prometheus:latest
        state: started
        restart_policy: always
        published_ports:
          - "9090:9090"
        volumes:
          - /tmp/prometheus.yml:/etc/prometheus/prometheus.yml
        networks:
          - name: awakenrise-network

    - name: Remover imagem antiga para evitar cache
      docker_image:
        name: "maribma19/awakenrise_frontend:latest"
        state: absent
        force_absent: yes

    - name: Pull da imagem do Frontend (Nova Versão)
      docker_image:
        name: "maribma19/awakenrise_frontend:latest"
        source: pull

    - name: Rodar container do Frontend
      docker_container:
        name: wepink-frontend
        image: "maribma19/awakenrise_frontend:latest"
        state: started
        restart_policy: always
        pull: yes
        recreate: yes
        published_ports:
          - "8081:8080" # Porta correta do nginx-unprivileged
        networks:
          - name: awakenrise-network

    - name: Verificar se o Frontend está rodando
      command: docker inspect -f "{{ '{{' }} .State.Running {{ '}}' }}" wepink-frontend
      register: frontend_status
      ignore_errors: yes

    - name: LOGS DO FRONTEND (Diagnóstico)
      command: docker logs wepink-frontend
      register: frontend_logs

    - name: Print Frontend Logs
      debug:
        var: frontend_logs.stdout_lines

    - name: Criar diretórios de provisionamento do Grafana
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /tmp/grafana/provisioning/datasources
        - /tmp/grafana/provisioning/dashboards
        - /tmp/grafana/provisioning/alerting

    - name: Configurar Data Source do Prometheus no Grafana
      copy:
        dest: /tmp/grafana/provisioning/datasources/prometheus.yml
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://prometheus:9090
              isDefault: true

    - name: Configurar Provider de Dashboards no Grafana
      copy:
        dest: /tmp/grafana/provisioning/dashboards/provider.yml
        content: |
          apiVersion: 1
          providers:
            - name: 'Awaken Dashboards'
              orgId: 1
              folder: ''
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /etc/grafana/provisioning/dashboards

    - name: Criar Dashboard do Awaken SaaS
      copy:
        dest: /tmp/grafana/provisioning/dashboards/awaken_main.json
        content: |
          {
            "annotations": { "list": [ { "builtIn": 1, "datasource": "-- Grafana --", "enable": true, "hide": true, "name": "Annotations & Alerts", "type": "dashboard" } ] },
            "editable": true, "fiscalYearStartMonth": 0, "graphTooltip": 0, "id": null, "links": [], "liveNow": false,
            "panels": [
              {
                "datasource": { "type": "prometheus", "uid": "Prometheus" },
                "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "mappings": [], "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 80 } ] } } },
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 }, "id": 2, "options": { "orientation": "auto", "reduceOptions": { "calcs": [ "lastNotNull" ], "fields": "", "values": false }, "showThresholdLabels": false, "showThresholdMarkers": true },
                "targets": [ { "datasource": { "type": "prometheus", "uid": "Prometheus" }, "editorMode": "code", "expr": "sum(awaken_payments_total{status=\"approved\"}) by (tenant_id)", "legendFormat": "Tenant: {{ '{{' }}tenant_id{{ '}}' }}", "range": true, "refId": "A" } ],
                "title": "Vendas Aprovadas por Lojista", "type": "timeseries"
              },
              {
                "datasource": { "type": "prometheus", "uid": "Prometheus" },
                "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "axisCenteredZero": false, "axisColorMode": "text", "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 0, "gradientMode": "none", "hideFrom": { "legend": false, "tooltip": false, "viz": false }, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": { "type": "linear" }, "showPoints": "auto", "spanNulls": false, "stacking": { "group": "A", "mode": "none" }, "thresholdsStyle": { "mode": "off" } }, "mappings": [], "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 80 } ] } } },
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 }, "id": 4, "options": { "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "single", "sort": "none" } },
                "targets": [ { "datasource": { "type": "prometheus", "uid": "Prometheus" }, "editorMode": "code", "expr": "rate(awaken_payment_retries_total[1m])", "legendFormat": "Retries: {{ '{{' }}tenant_id{{ '}}' }}", "range": true, "refId": "A" } ],
                "title": "Taxa de Retries (Resiliência)", "type": "timeseries"
              }
            ],
            "refresh": "5s", "schemaVersion": 37, "style": "dark", "tags": [], "templating": { "list": [] }, "time": { "from": "now-1h", "to": "now" }, "timepicker": {}, "timezone": "", "title": "Awaken SaaS - Torre de Controle", "uid": "awaken-main", "version": 1, "weekStart": ""
          }

    - name: Criar Configuração de Alertas do Grafana
      copy:
        dest: /tmp/grafana/provisioning/alerting/alerting.yaml
        content: |
          apiVersion: 1
          groups:
            - orgId: 1
              name: 'Awaken SaaS Rules'
              folder: 'Alerts'
              interval: 1m
              rules:
                - uid: 'high-payment-retries'
                  title: 'Taxa Elevada de Retries de Pagamento'
                  condition: 'B'
                  data:
                    - refId: 'A'
                      relativeTimeRange:
                        from: 300
                        to: 0
                      datasourceUid: 'Prometheus'
                      model:
                        expr: 'sum(rate(awaken_payment_retries_total[5m])) by (tenant_id)'
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: 'A'
                    - refId: 'B'
                      datasourceUid: '-100'
                      model:
                        conditions:
                          - evaluator:
                              params:
                                - 0.5
                              type: 'gt'
                            operator:
                              type: 'and'
                            query:
                              params:
                                - 'A'
                            reducer:
                              params: []
                              type: 'last'
                            type: 'query'
                        refId: 'B'
                        type: 'classic_conditions'
                  noDataState: 'NoData'
                  execErrState: 'Alerting'
                  for: '1m'
          contactPoints:
            - orgId: 1
              name: 'Discord Alerts'
              receivers:
                - uid: 'discord-alerts-receiver'
                  type: 'discord'
                  settings:
                    url: "{{ discord_webhook_url | default('YOUR_DISCORD_WEBHOOK_URL_HERE') }}"
          policies:
            - orgId: 1
              receiver: 'Discord Alerts'
              group_by: ['alertname']
              group_wait: 10s
              group_interval: 5m
              repeat_interval: 1h

    - name: Rodar container do Grafana
      docker_container:
        name: grafana
        image: grafana/grafana:latest
        state: started
        restart_policy: always
        published_ports:
          - "3000:3000"
        volumes:
          - /tmp/grafana/provisioning:/etc/grafana/provisioning
        env:
          GF_SECURITY_ADMIN_PASSWORD: "admin"
        networks:
          - name: awakenrise-network

    - name: Configurar VHost do Nginx
      template:
        src: nginx_vhost.j2
        dest: /etc/nginx/sites-available/awakenrise
      notify: Reload Nginx

    - name: Habilitar VHost do Nginx
      file:
        src: /etc/nginx/sites-available/awakenrise
        dest: /etc/nginx/sites-enabled/awakenrise
        state: link

    - name: Remover configuração padrão do Nginx
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Abrir portas no Firewall para HTTPS
      ufw:
        rule: allow
        port: 443
        proto: tcp

  handlers:
    - name: Reload Nginx
      service:
        name: nginx
        state: reloaded
