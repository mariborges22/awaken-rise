---
- name: Provisionamento e Deploy Wepink App
  hosts: staging
  become: yes
  vars:
    project_root: "/opt/wepink"
    app_image: "maribma19/awakenrise_backend:latest" # Substitua pelo seu usuário do Docker Hub

  tasks:
    - name: Atualizar cache do apt
      apt:
        update_cache: yes

    - name: Instalar dependências básicas
      apt:
        name:
          - curl
          - git
          - ufw
          - apt-transport-https
          - ca-certificates
          - software-properties-common
          - python3-pip
        state: present

    - name: Adicionar chave GPG do Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Adicionar repositório Docker
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present

    - name: Instalar Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Garantir que o Docker está rodando
      service:
        name: docker
        state: started
        enabled: yes

    - name: Permitir SSH no Firewall
      ufw:
        rule: allow
        name: OpenSSH

    - name: Permitir Portas de Aplicação e Monitoramento
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - '80'
        - '443'
        - '8080'  # Backend App
        - '3000'  # Grafana
        - '9090'  # Prometheus
        - '15672' # RabbitMQ Management

    - name: Desabilitar UFW (usar apenas Cloud Firewall da DO)
      ufw:
        state: disabled

    - name: Criar diretório do projeto
      file:
        path: "{{ project_root }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Criar rede customizada do Docker
      docker_network:
        name: awakenrise-network

    - name: Pull da imagem Docker mais recente
      docker_image:
        name: "{{ app_image }}"
        source: pull

    - name: Rodar container do RabbitMQ
      docker_container:
        name: rabbitmq
        image: "rabbitmq:3-management"
        state: started
        restart_policy: always
        published_ports:
          - "5672:5672"   # AMQP
          - "15672:15672" # Management UI
        env:
          RABBITMQ_DEFAULT_USER: "wepink_user"
          RABBITMQ_DEFAULT_PASS: "wepink_pass"
        networks:
          - name: awakenrise-network

    - name: Remover container antigo (se existir) para liberar porta
      docker_container:
        name: wepink-backend
        state: absent

    - name: Rodar container do Backend
      docker_container:
        name: awakenrise-backend
        image: "{{ app_image }}"
        state: started
        restart_policy: always
        published_ports:
          - "8080:8080"
        env:
          APP_ENV: staging
          DB_URL: "{{ mysql_user }}:{{ mysql_password }}@tcp({{ mysql_host }}:{{ mysql_port }})/defaultdb?tls=true&parseTime=true"
          REDIS_URL: "{{ redis_url }}"
          RABBITMQ_URL: "amqp://wepink_user:wepink_pass@rabbitmq:5672/"
          # Adicione outras variáveis de ambiente necessárias aqui
        networks:
          - name: awakenrise-network

    - name: Criar config básica do Prometheus
      copy:
        dest: /tmp/prometheus.yml
        content: |
          global:
            scrape_interval: 5s
          scrape_configs:
            - job_name: 'wepink-backend'
              static_configs:
                - targets: ['awakenrise-backend:8080']

    - name: Rodar container do Prometheus
      docker_container:
        name: prometheus
        image: prom/prometheus:latest
        state: started
        restart_policy: always
        published_ports:
          - "9090:9090"
        volumes:
          - /tmp/prometheus.yml:/etc/prometheus/prometheus.yml
        networks:
          - name: awakenrise-network

    - name: Pull da imagem do Frontend
      docker_image:
        name: "maribma19/awakenrise_frontend:latest"
        source: pull

    - name: Rodar container do Frontend
      docker_container:
        name: wepink-frontend
        image: "maribma19/awakenrise_frontend:latest"
        state: started
        restart_policy: always
        published_ports:
          - "80:8080"
        networks:
          - name: awakenrise-network

    - name: Rodar container do Grafana
      docker_container:
        name: grafana
        image: grafana/grafana:latest
        state: started
        restart_policy: always
        published_ports:
          - "3000:3000"
        env:
          GF_SECURITY_ADMIN_PASSWORD: "admin"
        networks:
          - name: awakenrise-network
