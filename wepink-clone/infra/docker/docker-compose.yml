version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: wepink_mysql
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: wepink
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    ports:
      - "3306:3306"
    volumes:
      - ../mysql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wepink_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: wepink_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  backend:
    build: ../../backend
    container_name: wepink_backend
    environment:
      - DB_URL=user:pass@tcp(mysql:3306)/wepink?parseTime=true
      - REDIS_URL=redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ../../frontend
    container_name: wepink_frontend
    # Note: In a production setup, we would use the nginx container to serve the frontend.
    # But for this compose, let's keep them separate or integrate into nginx.

  proxy:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: wepink_proxy
    ports:
      - "80:8080"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
