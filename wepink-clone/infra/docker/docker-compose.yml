
services:
  mysql:
    image: mysql:8.0
    container_name: wepink_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-pass}
      MYSQL_DATABASE: wepink
      MYSQL_USER: ${DB_USER:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../mysql:/docker-entrypoint-initdb.d
    networks:
      - wepink_internal
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wepink_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - wepink_internal
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: wepink_rabbitmq
    restart: unless-stopped
    ports:
      - "15672:15672" # Dashboard apenas (em prod idealmente via proxy ou fechado)
    networks:
      - wepink_internal
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5

  backend:
    build: 
      context: ../../backend
      dockerfile: Dockerfile
    container_name: wepink_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${DB_USER:-user}:${DB_PASSWORD:-pass}@tcp(mysql:3306)/wepink?parseTime=true
      - REDIS_URL=redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - wepink_internal
      - wepink_public
    deploy:
      resources:
        limits:
          memory: 256M

  frontend:
    build: 
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: wepink_frontend
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      - backend
    networks:
      - wepink_public
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  wepink_internal:
    driver: bridge
  wepink_public:
    driver: bridge

volumes:
  mysql_data:
