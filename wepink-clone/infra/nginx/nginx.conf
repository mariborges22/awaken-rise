limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_status 429;
limit_req_log_level warn; # Rate limit drops serão logados apenas como aviso (warn), não erro grave

# Formato de log estruturado em JSON para fácil ingestão no ElasticSearch, Datadog, etc.
log_format json_combined escape=json
  '{"time_local":"$time_iso8601",'
  '"remote_addr":"$remote_addr",'
  '"request":"$request",'
  '"status": "$status",'
  '"body_bytes_sent":"$body_bytes_sent",'
  '"request_time":"$request_time",'
  '"upstream_response_time":"$upstream_response_time",'
  '"http_referrer":"$http_referer",'
  '"http_user_agent":"$http_user_agent"}';

# Separação física de logs de sucesso e erro
access_log /var/log/nginx/access.log json_combined;
error_log /var/log/nginx/error.log warn;

server {
    listen 8080;
    server_name localhost;

    # Frontend - Angular
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Backend - Go API
    location /api/ {
        # Aplica o Rate Limit: máximo 20 reqs/seg por IP, permite pico (burst) de 10 requisições
        limit_req zone=api_limit burst=10 nodelay;

        # Timeouts agressivos de proxy para evitar "Nginx pendurado" em picos de carga
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # Remove /api prefix before forwarding to backend
        rewrite ^/api/(.*)$ /$1 break;
        
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
