<!-- Barra de Navegação Simples para Testes -->
<nav class="test-nav">
  <button (click)="view = 'dashboard'" [class.active]="view === 'dashboard'">PAINEL LOJISTA</button>
  <button (click)="view = 'onboarding'" [class.active]="view === 'onboarding'">ONBOARDING</button>
  <button (click)="view = 'checkout'" [class.active]="view === 'checkout'">CHECKOUT</button>
</nav>

<main>
  <app-dashboard *ngIf="view === 'dashboard'"></app-dashboard>
  <app-onboarding *ngIf="view === 'onboarding'"></app-onboarding>
  <app-order *ngIf="view === 'checkout'"></app-order>
</main>

<style>
  .test-nav {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 20px;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 1000;
  }
  .test-nav button {
    background: none;
    border: 1px solid rgba(255,255,255,0.1);
    color: #888;
    padding: 8px 20px;
    border-radius: 50px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.7rem;
    letter-spacing: 1px;
    transition: all 0.3s;
  }
  .test-nav button.active {
    background: var(--primary-color);
    color: white;
    border-color: var(--primary-color);
    box-shadow: 0 0 15px var(--accent-glow);
  }
</style>
