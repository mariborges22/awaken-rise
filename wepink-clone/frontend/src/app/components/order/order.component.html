<div class="checkout-wrapper">
  <div class="glass-card checkout-card">
    <div class="checkout-header">
      <div class="logo">AWAKEN<span class="dot">.</span>RISE</div>
      <h1>Portal de <span class="gradient-text">Checkout</span></h1>
    </div>

    <!-- Seção de Busca/Criação -->
    <div class="action-box">
      <div class="input-group">
        <input type="text" [(ngModel)]="orderIdInput" placeholder="ID do Pedido (ex: ord_123)">
        <button class="btn-secondary" (click)="lookupOrder()" [disabled]="loading">
          <span *ngIf="!loading">CONSULTAR</span>
          <span *ngIf="loading" class="loader"></span>
        </button>
      </div>
      <div class="divider"><span>OU</span></div>
      <button class="btn-primary full-width" (click)="createSampleOrder()" [disabled]="loading">
        CRIAR NOVO PEDIDO DE TESTE
      </button>
    </div>

    <!-- Detalhes do Pedido -->
    <div *ngIf="currentOrder" class="order-container animate-in">
      <div class="order-summary">
        <div class="summary-item">
          <label>NÚMERO DO PEDIDO</label>
          <span class="value">#{{ currentOrder.id.substring(0,8) }}</span>
        </div>
        <div class="summary-item">
          <label>STATUS</label>
          <span class="status-badge" [attr.data-status]="currentOrder.status">
            {{ currentOrder.status }}
          </span>
        </div>
      </div>

      <div class="items-list">
        <div *ngFor="let item of currentOrder.items" class="item-row">
          <div class="item-info">
            <span class="item-name">{{ item.product_id }}</span>
            <span class="item-qty">{{ item.quantity }}x</span>
          </div>
          <span class="item-price">R$ {{ item.price | number:'1.2-2' }}</span>
        </div>
      </div>

      <div class="total-section">
        <label>TOTAL A PAGAR</label>
        <span class="total-value">R$ {{ currentOrder.total | number:'1.2-2' }}</span>
      </div>

      <button *ngIf="currentOrder.status === 'PENDING'" 
              (click)="pay()" 
              class="pay-btn-glow"
              [disabled]="loading">
        <span *ngIf="!loading">FINALIZAR PAGAMENTO</span>
        <span *ngIf="loading" class="loader"></span>
      </button>

      <div *ngIf="currentOrder.status === 'CONFIRMED'" class="success-message">
        <span class="icon">✅</span> Pagamento Processado com Sucesso
      </div>
    </div>

    <div *ngIf="errorMessage" class="error-toast">
      {{ errorMessage }}
    </div>
  </div>
</div>
