name: Frontend CI

on:
  push:
    branches: [ master, staging ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ master, staging ]
    paths:
      - 'frontend/**'

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: cd frontend && npm install
      # Nota: Removido 'ng test' temporariamente se não houver karma.conf configurado
      # Mas o ideal é: run: cd frontend && npm run test -- --no-watch --no-progress --browsers=ChromeHeadless

  build-and-scan:
    name: Docker Build & Security Scan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build local image
        run: |
          docker build -t wepink-frontend:local ./frontend
          
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'wepink-frontend:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  smoke-test:
    name: Smoke Test
    needs: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Start Frontend container
        run: |
          docker build -t wepink-frontend:local ./frontend
          docker run -d --name smoke-frontend -p 8081:8080 wepink-frontend:local
          
      - name: Verify Nginx serving index.html
        run: |
          sleep 5
          curl -f http://localhost:8081 | grep -i "Wepink"
          
      - name: Cleanup
        if: always()
        run: docker rm -f smoke-frontend
