name: Frontend CI

on:
  push:
    branches: [ master, staging ]
    paths:
      - 'wepink-clone/frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ master, staging ]
    paths:
      - 'wepink-clone/frontend/**'

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wepink-clone/frontend/package.json
      - name: Install dependencies
        run: cd wepink-clone/frontend && npm install

  build-and-scan:
    name: Docker Build & Security Scan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build local image
        run: |
          docker build -t wepink-frontend:local ./wepink-clone/frontend
          
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'wepink-frontend:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  smoke-test:
    name: Smoke Test
    needs: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Start Frontend container
        run: |
          docker build -t wepink-frontend:local ./wepink-clone/frontend
          docker run -d --name smoke-frontend -p 8081:8080 wepink-frontend:local
          
      - name: Verify Nginx serving index.html
        run: |
          sleep 5
          curl -f http://localhost:8081 | grep -i "Wepink"
          
      - name: Cleanup
        if: always()
        run: docker rm -f smoke-frontend

  push-image:
    name: Push Docker Image
    needs: smoke-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./wepink-clone/frontend
          push: true
          tags: mariborges22/wepink-frontend:latest
